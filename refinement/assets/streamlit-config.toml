# .streamlit/config.toml
# Sys Commodities Research Demo: institutional research theme.
#
# The [server] and [browser] blocks below are the repo's existing settings,
# copied verbatim including the port comment. Everything from [client] down
# is new: the file currently has no [theme] block at all.
#
# Version sensitivity: see the marked block. Check what Streamlit resolves
# to after T0.7 before keeping it.

# Port must agree with the Dockerfile EXPOSE and the README front-matter
# app_port, or the HF Space renders a blank page.
[server]
port = 7860
address = "0.0.0.0"
headless = true

[browser]
gatherUsageStats = false


# ----------------------------------------------------------------------
# Client chrome
# ----------------------------------------------------------------------
[client]
# "minimal" drops the Deploy button and trims the hamburger menu to
# Rerun / Settings. A visitor to a published research viewer has no use
# for the dev menu.
toolbarMode = "minimal"

# Keep Python tracebacks off a public page. Errors still reach the Space
# logs. Streamlit >= 1.42 takes a string; older versions take a bool: false.
showErrorDetails = "none"


# ----------------------------------------------------------------------
# Theme: core keys, safe on Streamlit >= 1.28
# ----------------------------------------------------------------------
[theme]
base = "light"

# Deep institutional blue, replacing Streamlit's default #FF4B4B, which
# currently drives the active nav item, slider tracks, checkboxes, the
# multiselect chips on the Strategies filter, the running spinner and link
# colour.
#
# Same value as the dl-research-demo and ml-short-reversion packages,
# deliberately: three public Spaces from the same author should read as one
# body of work.
primaryColor = "#1F4E79"

backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#1A1D24"

font = "sans serif"


# ----------------------------------------------------------------------
# VERSION-SENSITIVE BLOCK (Streamlit >= 1.44)
# Delete from here to the end of the file if your resolved version rejects
# a key. None of it is load-bearing; the palette above carries the theme.
# ----------------------------------------------------------------------
linkColor = "#1F4E79"
borderColor = "#E2E6EB"
showWidgetBorder = true
baseRadius = "small"
baseFontSize = 15

# Optional upgrade: a real typeface instead of the system stack. Self-host
# the woff2 files so the Space does not depend on a CDN.
#
# [[theme.fontFaces]]
# family = "Source Serif 4"
# url = "app/static/SourceSerif4-Regular.woff2"
# weight = 400
# style = "normal"
#
# headingFont = "Source Serif 4"
# font = "Source Sans 3"


# The sidebar carries the project title, the nav and the filters, so give
# it its own surface and let it read as chrome rather than content.
[theme.sidebar]
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#E2E6EB"
